[package]
name = "sai"
description = "Command-line access to Sai trading and market data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chrono.workspace = true
clap.workspace = true
libc.workspace = true
rmcp = { version = "3.11", default-features = false, features = ["local", "server", "transport-io"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rustix = { workspace = true, features = ["termios"] }
rustyline = { version = "17", default-features = false, features = ["custom-bindings"] }
sai-core = { path = "../sai-core" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
signal-hook = { version = "0.3", default-features = false }
toml_edit = { workspace = true, features = ["display"] }
tokio = { workspace = true, features = ["process", "signal", "sync"] }
uuid.workspace = true
zeroize.workspace = true
zmij = "1"
