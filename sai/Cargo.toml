[package]
name = "sai"
description = "Command-line access to Sai trading and market data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chrono.workspace = true
clap.workspace = true
rmcp = { version = "3.11", default-features = false, features = ["local", "server", "transport-io"] }
sai-core = { path = "../sai-core" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "signal"] }
uuid.workspace = true
zmij = "1"

[dev-dependencies]
tempfile.workspace = true
