name: "CI"

# Keep the required jobs present on every PR and filter their steps by project.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

# A new push to a pull request cancels its older runs. Runs on main finish.
# The PR number keeps fork branches with the same name from cancelling each
# other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job names are the required check names on main. Rename them together
# with the "Required checks" ruleset.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ github.event_name != 'pull_request' || steps.paths.outputs.python != 'false' }}
      rust: ${{ github.event_name != 'pull_request' || steps.paths.outputs.rust != 'false' }}
    steps:
      - name: Detect changed projects
        id: paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python:
              - 'cli/**'
              - 'tests/parity/**'
              - 'skills/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'setup.py'
              - 'justfile'
              - '.github/workflows/ci.yml'
            rust:
              - 'sai-core/**'
              - 'sai/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'

  # Omit a project's steps only when detection succeeds and reports 'false'.
  test:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # The suite takes under a minute; a hung test must not hold a required
    # check for GitHub's six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.result != 'success' || needs.changes.outputs.python != 'false'
        with:
          persist-credentials: false

      # 3.11 is the minimum version in pyproject's requires-python.
      - name: Install uv and Python
        if: needs.changes.result != 'success' || needs.changes.outputs.python != 'false'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"

      - name: Install dependencies from uv.lock
        if: needs.changes.result != 'success' || needs.changes.outputs.python != 'false'
        run: uv sync --locked --all-groups

      - run: uv run pytest
        if: needs.changes.result != 'success' || needs.changes.outputs.python != 'false'

      - name: Check parity in a loopback network namespace
        if: needs.changes.result != 'success' || needs.changes.outputs.python != 'false'
        run: |
          if ! unshare -Urn ip link set lo up; then
            sudo apparmor_parser -r <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          /usr/bin/unshare flags=(unconfined) {
            userns,
          }
          PROFILE
          fi
          unshare -Urn ip link set lo up
          uv run pytest -m parity_namespace tests/parity
          uv run python tests/parity/parity.py

  check:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # The suite takes under a minute; a hung test must not hold a required
    # check for GitHub's six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.result != 'success' || needs.changes.outputs.python != 'false'
        with:
          persist-credentials: false

      - name: Install uv and Python
        if: needs.changes.result != 'success' || needs.changes.outputs.python != 'false'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"

      - name: Install dependencies from uv.lock
        if: needs.changes.result != 'success' || needs.changes.outputs.python != 'false'
        run: uv sync --locked --all-groups

      # Same commands as "just check".
      - run: uv run ruff check .
        if: needs.changes.result != 'success' || needs.changes.outputs.python != 'false'
      - run: uv run ruff format --check .
        if: needs.changes.result != 'success' || needs.changes.outputs.python != 'false'
      - run: uv run ty check cli/sai_cli
        if: needs.changes.result != 'success' || needs.changes.outputs.python != 'false'

  rust:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.result != 'success' || needs.changes.outputs.rust != 'false' || needs.changes.outputs.python != 'false'
        with:
          persist-credentials: false

      - run: cargo fmt --all --check
        if: needs.changes.result != 'success' || needs.changes.outputs.rust != 'false' || needs.changes.outputs.python != 'false'
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
        if: needs.changes.result != 'success' || needs.changes.outputs.rust != 'false' || needs.changes.outputs.python != 'false'
      - run: cargo test --locked --workspace
        if: needs.changes.result != 'success' || needs.changes.outputs.rust != 'false' || needs.changes.outputs.python != 'false'

      # Use the C4 Python reference in sai/README.md on both PR and push runs.
      - name: Check out the Python parity reference
        if: needs.changes.result != 'success' || needs.changes.outputs.rust != 'false' || needs.changes.outputs.python != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5b6e5fbf26975a837dfd0a0cad1d1fd40c5b2bdf
          path: .parity-python
          persist-credentials: false

      - name: Check out the Python account overview reference
        if: needs.changes.result != 'success' || needs.changes.outputs.rust != 'false' || needs.changes.outputs.python != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 53ef4fb70f30bd8c340749b131f509d65ab86ed4
          path: .parity-overview-python
          persist-credentials: false

      - name: Install uv and Python for parity
        if: needs.changes.result != 'success' || needs.changes.outputs.rust != 'false' || needs.changes.outputs.python != 'false'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"

      - run: |
          uv sync --locked --all-groups
          uv sync --project .parity-python --locked --all-groups
          uv sync --project .parity-overview-python --locked --all-groups --python 3.13
        if: needs.changes.result != 'success' || needs.changes.outputs.rust != 'false' || needs.changes.outputs.python != 'false'
      - run: cargo build --locked --bin sai
        if: needs.changes.result != 'success' || needs.changes.outputs.rust != 'false' || needs.changes.outputs.python != 'false'
      - name: Compare the Rust and Python CLIs
        if: needs.changes.result != 'success' || needs.changes.outputs.rust != 'false' || needs.changes.outputs.python != 'false'
        env:
          SAI_PARITY_BIN: ${{ github.workspace }}/target/debug/sai
          SAI_PARITY_PYTHON: ${{ github.workspace }}/.parity-python/.venv/bin/sai
        run: uv run --locked pytest tests/parity

      - name: Compare account overview in a loopback network namespace
        if: needs.changes.result != 'success' || needs.changes.outputs.rust != 'false' || needs.changes.outputs.python != 'false'
        env:
          SAI_PARITY_BIN: ${{ github.workspace }}/target/debug/sai
          SAI_PARITY_OVERVIEW_PYTHON: ${{ github.workspace }}/.parity-overview-python/.venv/bin/sai
        run: |
          if ! unshare -Urn ip link set lo up; then
            sudo apparmor_parser -r <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          /usr/bin/unshare flags=(unconfined) {
            userns,
          }
          PROFILE
          fi
          uv run --locked python tests/parity/parity.py --case 'account-overview-*' --case account-bare
          unshare -Urn sh -c 'ip link set lo up && exec "$@"' sh \
            uv run --locked pytest -m parity_namespace tests/parity/test_overview_dns.py
