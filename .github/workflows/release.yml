name: "Release"

# `just release X.Y.Z --run` pushes the tag that starts publication.
on:
  push:
    tags: ["sai-cli/v*"]
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/native-dist.yml'
      - 'Cargo.toml'
      - 'pyproject.toml'
      - 'shim/**'
      - 'scripts/check_release.py'
      - 'scripts/native-dist.py'
      - 'scripts/release.py'
      - 'cli/sai_cli/tests/test_release.py'
      - 'tests/parity/test_native_release.py'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Planned tag (sai-cli/vX.Y.Z). This run only stages artifacts.'
        required: true
        type: string
      python-only:
        description: 'Rehearse only the full Python wheel and sdist.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tag-object: ${{ steps.plan.outputs.tag-object }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"

      - name: Check tag provenance and select release mode
        id: plan
        env:
          PYTHON_ONLY: ${{ inputs.python-only }}
        shell: bash
        run: |
          mode=native
          tag_object=
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            built="$(git rev-parse HEAD)"
            test "$built" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
            test "$built" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
            git rev-list --first-parent origin/main | grep -Fx "$built" >/dev/null
            tag_object="$(git rev-parse "refs/tags/$TAG")"
            mode="$(uv run --no-project python scripts/check_release.py "$TAG" --print-mode \
              --built "$built" --tag-object "$tag_object" --remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY")"
          elif [[ "$PYTHON_ONLY" == true ]]; then
            mode=python-only
          fi
          printf 'mode=%s\ntag-object=%s\n' "$mode" "$tag_object" >> "$GITHUB_OUTPUT"

      - name: Check package versions
        if: github.event_name != 'pull_request'
        env:
          RELEASE_MODE: ${{ steps.plan.outputs.mode }}
        run: |
          if [[ "$RELEASE_MODE" == python-only ]]; then
            uv run --no-project python scripts/check_release.py "$TAG"
          else
            uv run --no-project python scripts/native-dist.py check-tag "$TAG"
          fi

      - name: Install dependencies from uv.lock
        run: uv sync --locked --all-groups

      - name: Run Python tests
        env:
          RELEASE_MODE: ${{ steps.plan.outputs.mode }}
        shell: bash
        run: |
          args=()
          if [[ "$RELEASE_MODE" == python-only ]]; then
            # Native staging tests use the current Cargo and shim versions.
            args+=(--ignore=tests/parity/test_native_release.py)
          fi
          uv run pytest "${args[@]}"

      # Same command as "just build-check".
      - name: Check that the wheel and sdist ship the skill directory
        run: uv run python scripts/check_dist.py

      - name: Build the wheel and sdist
        run: uv build --out-dir dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sai-full-python
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  native:
    needs: python
    if: needs.python.outputs.mode == 'native'
    uses: ./.github/workflows/native-dist.yml

  assemble:
    name: Assemble release candidate (${{ matrix.mode }})
    needs: [python, native]
    if: >-
      ${{ !cancelled() && needs.python.result == 'success' &&
          (needs.native.result == 'success' || needs.python.outputs.mode == 'python-only') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        mode: ${{ fromJSON(github.event_name == 'pull_request' && '["native","python-only"]' || format('["{0}"]', needs.python.outputs.mode)) }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sai-full-python
          path: dist/python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.mode == 'native'
        with:
          name: sai-native-ci
          path: dist/native
      - name: Stage the release assets and write SHA256SUMS
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            args+=(--tag "$TAG")
          fi
          if [[ "$RELEASE_MODE" == python-only ]]; then
            uv run --no-project python scripts/native-dist.py stage-python-release \
              dist/python dist/release "${args[@]}"
          else
            uv run --no-project python scripts/native-dist.py stage-release \
              dist/native dist/python dist/release "${args[@]}"
          fi
      - name: Check release checksums
        working-directory: dist/release
        run: sha256sum --check --strict SHA256SUMS
      - name: Render native release notes
        if: matrix.mode == 'native'
        run: uv run --no-project python scripts/native-dist.py release-notes > dist/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.mode == 'native'
        with:
          name: sai-release-notes
          path: dist/release-notes.md
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'pull_request' && matrix.mode == 'python-only' && 'sai-python-release-candidate' || 'sai-release-candidate' }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish immutable release
    if: ${{ !cancelled() && needs.assemble.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: [python, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      TAG_OBJECT: ${{ needs.python.outputs.tag-object }}
      RELEASE_MODE: ${{ needs.python.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sai-release-candidate
          path: dist/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.python.outputs.mode == 'native'
        with:
          name: sai-release-notes
          path: dist
      - name: Verify staged release checksums
        working-directory: dist/release
        run: sha256sum --check --strict SHA256SUMS

      # --verify-tag checks existence. Recheck the annotation and its commit.
      - name: Check that the remote tag still matches the build
        run: |
          uv run --no-project python scripts/check_release.py "$TAG" \
            --built "$(git rev-parse HEAD)" --tag-object "$TAG_OBJECT" \
            --remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

      - &require-immutable-releases
        name: Require immutable releases
        env:
          GH_TOKEN: ${{ secrets.NIBIRU_PM }}
        shell: bash
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::The NIBIRU_PM Actions secret is unavailable. The check requires repository Administration read access."
            exit 1
          fi
          if ! enabled="$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled == true')" ||
             [[ "$enabled" != true ]]; then
            echo "::error::GitHub did not confirm that immutable releases are enabled. Check the repository setting and NIBIRU_PM access."
            exit 1
          fi
          echo "GitHub confirmed that immutable releases are enabled using NIBIRU_PM."

      # gh creates a draft, attaches every asset, then publishes it.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"; then
            if [[ "$draft" == true ]]; then
              echo "::error::A draft release already exists for $TAG"
              exit 1
            fi
            echo "Release $TAG already exists. Verify its attestation against this candidate."
            exit 0
          fi
          version="${TAG#sai-cli/}"
          flags=()
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if [[ "$RELEASE_MODE" == native ]]; then
            test -s dist/release-notes.md
            flags+=(--notes-file dist/release-notes.md)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "sai-cli $version" --generate-notes "${flags[@]}" dist/release/*

  dry-run-immutability:
    name: Check release immutability for dry run
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - *require-immutable-releases

  verify:
    name: Verify immutable release
    needs: [python, assemble, publish]
    # A dry run proves the verifier's permissions against an existing immutable release.
    if: >-
      ${{ !cancelled() && needs.assemble.result == 'success' &&
          (needs.publish.result == 'success' ||
           (github.event_name != 'push' && github.repository == 'SaiDotFun/open-sai')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || 'sai-cli/v0.1.3' }}
      TAG_OBJECT: ${{ needs.python.outputs.tag-object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'push'
        with:
          name: sai-release-candidate
          path: dist/release
      - name: Download the immutable rehearsal release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist/release --pattern '*'

      - name: Verify the attestation for the tag and release files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag_object="${TAG_OBJECT:-$(git rev-parse "refs/tags/$TAG")}"
          # GitHub may take a few seconds to generate the release attestation.
          for delay in 0 5 15 30; do
            sleep "$delay"
            if gh release verify "$TAG" --repo "$GITHUB_REPOSITORY" --format json \
              > "$RUNNER_TEMP/sai-release-attestation.json"; then
              uv run --no-project python scripts/native-dist.py check-attestation \
                dist/release "$tag_object" < "$RUNNER_TEMP/sai-release-attestation.json"
              exit 0
            fi
          done
          exit 1
