[workspace]
members = ["sai-core", "sai"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SaiDotFun/open-sai"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
