[workspace]
members = ["sai-core", "sai"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SaiDotFun/open-sai"

[workspace.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }
num-bigint = "0.4"
regex = "1"
rustix = { version = "1", features = ["fs", "process"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
tempfile = "3"
toml_edit = { version = "0.23.10", default-features = false, features = ["parse"] }
# Later parser releases accept TOML 1.1 syntax rejected by Python 3.11.
toml_parser = "=1.0.5"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
