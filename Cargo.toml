[workspace]
members = ["sai-core", "sai"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SaiDotFun/open-sai"

[workspace.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
bech32 = "0.11"
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }
num-bigint = "0.4"
regex = "1"
flate2 = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-timeout = "0.5"
hyper-util = { version = "0.1", features = ["client-legacy", "client-proxy", "client-proxy-system", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
webpki-roots = "1"
rustix = { version = "1", features = ["fs", "process"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
toml_edit = { version = "0.23.10", default-features = false, features = ["parse"] }
# Later parser releases accept TOML 1.1 syntax rejected by Python 3.11.
toml_parser = "=1.0.5"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
