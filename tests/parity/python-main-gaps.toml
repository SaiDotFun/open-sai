# Python main behavior for the Rust port. The release manifest compares v0.1.2.

[gap.collateral-previews]
owner = "#231"
difference = "Leverage and margin dry runs show before and after collateral in USDC and oracle-valued USD in text and JSON. Margin adds can size the quote with --max-collateral-usd."

[gap.market-symbol-and-table]
owner = "#231"
difference = "Trade open accepts case-insensitive market symbols and reports ambiguous IDs. Market list prints a symbol, ID, collateral, and price table in text mode."

[gap.cancel-command]
owner = "#231"
difference = "Trade cancel and close --cancel-order share the dry run, digest confirmation, pending-order check, and wait path. Rust cancel already exists and still needs --preview-digest and matching help."

[gap.balance-source-age]
owner = "#231"
difference = "Account overview and account balances show the source block and age, mark ages over five minutes stale, and report an unknown age when block time cannot be verified."

[gap.trade-wait-progress]
owner = "#231"
difference = "A text-mode trade --wait prints one stderr line before polling, then writes the receipt to stdout. JSON mode has no progress line."
