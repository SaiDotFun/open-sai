# List uncovered commands explicitly so adding a command requires a decision.
[deferred]
"auth import" = "Successful imports are compared with a fixture clipboard and PTY in test_auth.py."
"auth login" = "Compared with fixture signing programs and loopback Keeper in test_auth.py."
"auth renew" = "Compared with Python main in test_auth.py."
"intent wait" = "Covered by the pinned, stateful replays in test_intent_wait.py."

