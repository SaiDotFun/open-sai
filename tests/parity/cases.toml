args = ["mcp","serve","--endpoint","{keeper}?fixture=hidden","--ws-endpoint","{ws}?fixture=hidden","--lcd-endpoint","{http}/fixture-lcd-private?fixture=hidden"]
mode = "mcp"
mcp_profile = "info"
seed = "mcp-info-cache"

[[case]]
name = "mcp-market-number-spelling"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "number-spelling"
server = "read-number-spelling"
wire = ["tokenPricesUsd"]

[[case]]
name = "mcp-account-intent-reads"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "reads"
seed = "ledger"
server = "mcp-reads"
wire = ["trades", "tradeHistory", "ws:init", "ws:userBalances", "userIntents", "intentTradeHistory", "userIntents"]
# Rust still reconciles with the older history query. The response must match.
mcp_native_wire = ["trades", "tradeHistory", "ws:init", "ws:userBalances", "userIntents", "tradeHistory", "userIntents"]

[[case]]
name = "mcp-argument-validation"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "validation"

[[case]]
name = "mcp-auth-list"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "auth-list"
seed = "accounts"

[[case]]
name = "mcp-auth-status"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "auth-status"
seed = "doctor-near-expiry"

[[case]]
name = "mcp-auth-use"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "auth-use"
seed = "mcp-auth-switch"
state = { "trader/sessions.json#payload.active" = "0x2222222222222222222222222222222222222222", "trader/sessions.lock#@mode" = 0o600 }

[[case]]
name = "mcp-auth-use-invalid-expiry"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "auth-use-invalid-expiry"
seed = "mcp-invalid-expiry"
state = { "trader/sessions.json#payload.active" = "0x1111111111111111111111111111111111111111" }

[[case]]
name = "mcp-auth-numeric-expiry"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "auth-use-invalid-expiry"
seed = "mcp-numeric-expiry"
state = { "trader/sessions.json#payload.active" = "0x1111111111111111111111111111111111111111", "trader/sessions.json#payload.sessions.0x1111111111111111111111111111111111111111.expiresAt" = 123 }

[[case]]
name = "mcp-auth-missing-expiry"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "auth-use-invalid-expiry"
seed = "mcp-missing-expiry"
state = { "trader/sessions.json#payload.active" = "0x1111111111111111111111111111111111111111", "trader/sessions.json#payload.sessions.0x1111111111111111111111111111111111111111.expiresAt" = "<absent>" }

[[case]]
name = "mcp-auth-redaction"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "auth-redaction"
seed = "mcp-auth-redaction"
state = { "logs/cli.jsonl" = "<absent>", "trader/sessions.json#payload.active" = "0x1111111111111111111111111111111111111111" }

[[case]]
name = "mcp-overview-validation"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "overview-validation"

[[case]]
name = "mcp-intent-wait-validation"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "wait-validation"

[[case]]
name = "mcp-intent-wait-final"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "wait-final"
server = "mcp-wait-final"
seed = "ledger"
wire = ["waitUserIntents", "intentTradeHistory"]
state = { "trader/intents.sqlite3#tables.intents.rows.0.status" = "terminal", "trader/intents.sqlite3#tables.intents.rows.1" = "<absent>" }

[[case]]
name = "mcp-intent-wait-pending"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "wait-pending"
server = "mcp-wait-pending"
seed = "ledger"
wire = ["waitUserIntents", "waitUserIntents"]
state = { "trader/intents.sqlite3#tables.intents.rows.0.status" = "unknown", "trader/intents.sqlite3#tables.intents.rows.0.keeper_status" = "pending", "trader/intents.sqlite3#tables.intents.rows.1" = "<absent>" }

[[case]]
name = "mcp-logs-intent-validation"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "logs-validation"

[[case]]
name = "mcp-session-refusals"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "refusals"

[[case]]
name = "mcp-session-reloads"
args = ["--endpoint","{http}","mcp","serve","--endpoint","{keeper}"]
mode = "mcp"
mcp_profile = "session"
# Temporary. The native-only trade_open probe expires this when the tool lands.
mcp_deferred_trade_exception = true
seed = "session"
wire = ["trades", "trades", "trades"]

[[case]]
name = "mcp-keeper-errors"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "keeper-errors"
server = "keeper-error"
wire = ["borrowings", "tokenPricesUsd", "trades", "tradeHistory", "userIntents"]

[[case]]
name = "mcp-stream-error"
args = ["mcp","serve"]
mode = "mcp"
mcp_profile = "stream-error"
server = "ws-partial"
wire = ["ws:init", "ws:userBalances", "ws:pong"]

[[case]]
name = "logs-path"
args = ["--json","logs","path"]

[[case]]
name = "logs-tail"
args = ["--json","logs","tail","--event","keeper.request"]
mode = "jsonl"
setup = ["--json","market","prices"]
wire = ["tokenPricesUsd"]

[[case]]
name = "update-check"
args = ["--json","update","--check","--api-base","{http}","--web-base","{http}"]
wire = ["releases"]
state = { "update.json#latest" = "sai-cli/v0.99.0", "update.json#schema" = 1, "update.json#@mode" = 0o600 }

[[case]]
name = "trade-open-market"
args = ["--json","trade","open","--market","3","--side","long","--type","market","--amount","20","--leverage","2","--slippage","1","--price","100","--dry-run"]
wire = ["borrowings", "oneClickTrading", "node_info", "get_market", "get_group", "get_pair_custom_max_leverage", "get_fees", "get_collateral_price"]

[[case]]
name = "trade-close"
args = ["--json","trade","close","7","--dry-run"]
expect = 6

[[case]]
name = "trade-cancel"
args = ["--json","trade","close","7","--cancel-order","--dry-run"]
seed = "session"
server = "pending-order"
wire = ["oneClickTrading", "node_info", "get_trade_raw"]

[[case]]
name = "trade-tpsl"
args = ["--json","trade","tpsl","7","--take-profit","110","--clear-stop-loss","--dry-run"]
expect = 6

[[case]]
name = "trade-leverage"
args = ["--json","trade","leverage","7","--leverage","5","--dry-run"]
expect = 6

[[case]]
name = "trade-margin"
args = ["--json","trade","margin","7","--direction","add","--amount","1","--dry-run"]
seed = "session"
wire = [
    "oneClickTrading", "node_info", "trade", "borrowing", "get_trade_raw",
    "get_exchange_balance", "is_after_hours_market", "get_trade_raw", "get_market",
    "market_order_config", "get_perp_prices", "is_after_hours_market", "get_group",
    "get_pair_custom_max_leverage", "get_fees", "quote_trade", "get_exchange_balance",
]
state = { "trader/intents.sqlite3" = "<absent>" }

[[case]]
name = "trade-partial-close"
args = ["--json","trade","partial-close","7","--percent","50","--dry-run"]
seed = "session"
wire = [
    "oneClickTrading", "node_info", "trade", "borrowing", "get_trade_raw",
    "get_exchange_balance", "is_after_hours_market",
    "get_collateral_price", "get_trade_raw", "market_order_config", "get_perp_prices", "get_liquidation_price",
    "is_after_hours_market", "get_market", "get_fees",
]
state = { "trader/intents.sqlite3" = "<absent>" }

[[case]]
name = "trade-concurrent-close"
args = ["--json", "trade", "close", "7"]
seed = "session"
server = "concurrent-close"
wire = [
    "trade", "oneClickTrading", "node_info", "get_trade_raw", "borrowing",
    "get_exchange_balance", "get_trade_raw", "market_order_config", "get_perp_prices",
    "get_liquidation_price", "is_after_hours_market", "get_market", "get_fees",
    "recordUserIntent",
    "trade", "oneClickTrading", "node_info", "get_trade_raw", "borrowing",
    "get_exchange_balance", "get_trade_raw", "market_order_config", "get_perp_prices",
    "get_liquidation_price", "is_after_hours_market", "get_market", "get_fees",
]
state = { "trader/intents.sqlite3#tables.intents.rows.0.status" = "accepted", "trader/intents.sqlite3#tables.intents.rows.1" = "<absent>" }
