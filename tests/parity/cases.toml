# List uncovered commands explicitly so adding a command requires a decision.
[deferred]
"auth import" = "Requires an isolated clipboard input."
"auth login" = "Requires an isolated signing program and challenge."
"mcp install" = "Requires a client registration fixture."
"mcp uninstall" = "Requires a client registration fixture."
"logs intent" = "Rust ports log queries in lane C9 (issue 49); its cases land with it."
"logs run" = "Rust ports log queries in lane C9 (issue 49); its cases land with it."
"logs stats" = "Rust ports log queries in lane C9 (issue 49); its cases land with it."
"skill install" = "Writes to the agents skill directory outside SAI_HOME."

[[case]]
name = "version"
args = ["--version"]
mode = "text"

[[case]]
name = "help"
args = ["--help"]
mode = "text"

[[case]]
name = "skill-flag"
args = ["--skill"]
mode = "text"

[[case]]
name = "config-list"
args = ["--json","config","list"]

[[case]]
name = "config-get-default"
args = ["--json","config","get","logs.keep_days"]

[[case]]
name = "config-get-env"
args = ["--json","config","get","keeper.endpoint"]

[[case]]
name = "config-get-file"
args = ["--json","config","get","update.auto"]
seed = "config"

[[case]]
name = "config-get-text"
args = ["config","get","keeper.endpoint"]
mode = "text"

[[case]]
name = "config-set"
args = ["--json","config","set","update.auto","false"]
state = { "config.toml#update.auto" = false, "config.toml#@mode" = 0o600 }

[[case]]
name = "config-set-existing"
args = ["--json","config","set","update.auto","false"]
seed = "config"
state = { "config.toml#update.auto" = false, "config.toml#logs.keep_days" = 3 }

[[case]]
name = "config-unset"
args = ["--json","config","unset","update.auto"]
seed = "config"
state = { "config.toml#update" = {}, "config.toml#logs.keep_days" = 3 }

[[case]]
name = "config-invalid-value"
args = ["--json","config","set","logs.keep_days","0"]
expect = 2
state = { "config.toml" = "<absent>" }

[[case]]
name = "config-unknown-key"
args = ["config","get","fixture.unknown"]
mode = "text"
expect = 2

